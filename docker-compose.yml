version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
  # --- SERVICE MINIO ---
  minio:
    image: minio/minio
    ports:
      - "9000:9000" # Port de l'API S3
      - "9001:9001" # Port de la Console d'administration Web
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin_password"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data: